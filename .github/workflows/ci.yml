name: CI

on:
  pull_request:
  push:
    branches: [staging, master]

jobs:
  dependency-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run dependency analyzer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            npm run dependency:check --workspace @ai-nexus/api-edge -- --head "$HEAD_SHA" --repository "noa-s/ai-nexus"
          else
            npm run dependency:check --workspace @ai-nexus/api-edge -- --base "$BASE_SHA" --head "$HEAD_SHA" --repository "noa-s/ai-nexus"
          fi

  node-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Node API container
        run: |
          echo "Building Node API container..."
          docker compose build api-edge
          echo "Node API container build completed."
      - name: Run Node tests in container
        run: |
          echo "Running Node tests in container..."
          docker compose run --rm api-edge npm test --workspace @ai-nexus/api-edge
          echo "Node tests completed."
      - name: Start Node API container
        run: |
          echo "Starting Node API container..."
          docker compose up -d postgres api-edge
          echo "Node API container started."
      - name: Wait for API readiness
        run: |
          echo "Waiting for API readiness..."
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/health; then
              echo "API Edge is ready."
              exit 0
            fi
            sleep 2
          done
          echo "API Edge did not become ready"
          docker compose logs api-edge
          exit 1
      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up Node API resources..."
          docker compose down -v
          echo "Node API cleanup completed."

  python-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Python worker container
        run: |
          echo "Building Python worker container..."
          docker compose build ai-data-worker
          echo "Python worker container build completed."
      - name: Run Python tests in container
        run: |
          echo "Running Python tests in container..."
          docker compose run --rm ai-data-worker python -m unittest discover -s tests
          echo "Python tests completed."
      - name: Run Python compile check in container
        run: |
          echo "Running Python compile check in container..."
          docker compose run --rm ai-data-worker python -m compileall -q src tests
          echo "Python compile check completed."
      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up Python worker resources..."
          docker compose down -v
          echo "Python cleanup completed."

  database-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL with pgvector
        run: |
          echo "Starting PostgreSQL with pgvector..."
          docker compose up -d postgres
      - name: Wait for PostgreSQL readiness
        run: |
          echo "Waiting for PostgreSQL readiness..."
          for attempt in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U ai_nexus -d ai_nexus; then
              echo "PostgreSQL is ready."
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready"
          exit 1
      - name: Apply initial migration
        run: |
          echo "Applying initial database migration..."
          docker compose exec -T postgres psql -U ai_nexus -d ai_nexus --set ON_ERROR_STOP=1 -f /dev/stdin < database/migrations/001_initial_platform.sql
          echo "Initial database migration applied."
      - name: Apply identity authorization policy migration
        run: |
          echo "Applying identity authorization policy migration..."
          docker compose exec -T postgres psql -U ai_nexus -d ai_nexus --set ON_ERROR_STOP=1 -f /dev/stdin < database/migrations/002_identity_authorization_policy.sql
          echo "Identity authorization policy migration applied."
      - name: Apply artifact and agent registry migration
        run: |
          echo "Applying artifact and agent registry migration..."
          docker compose exec -T postgres psql -U ai_nexus -d ai_nexus --set ON_ERROR_STOP=1 -f /dev/stdin < database/migrations/003_artifact_agent_registry.sql
          echo "Artifact and agent registry migration applied."
      - name: Apply dependency graph migration
        run: |
          echo "Applying dependency graph migration..."
          docker compose exec -T postgres psql -U ai_nexus -d ai_nexus --set ON_ERROR_STOP=1 -f /dev/stdin < database/migrations/004_dependency_graph.sql
          echo "Dependency graph migration applied."
      - name: Verify pgvector
        run: |
          echo "Verifying pgvector extension..."
          docker compose exec -T postgres psql -U ai_nexus -d ai_nexus --set ON_ERROR_STOP=1 -c "SELECT extname FROM pg_extension WHERE extname = 'vector';"
          echo "pgvector verification completed."
      - name: Verify policy lifecycle and immutability
        run: |
          echo "Verifying policy lifecycle and immutable content..."
          docker compose exec -T postgres psql -U ai_nexus -d ai_nexus --set ON_ERROR_STOP=1 -c "INSERT INTO policy.policy(policy_id, policy_type) VALUES ('ci-policy', 'access') ON CONFLICT DO NOTHING; INSERT INTO policy.policy_version(policy_id, version, content, lifecycle_status) VALUES ('ci-policy', '1', '{\"action\":\"read\"}', 'DRAFT') ON CONFLICT DO NOTHING; UPDATE policy.policy_version SET lifecycle_status = 'ACTIVE' WHERE policy_id = 'ci-policy' AND version = '1';"
          if docker compose exec -T postgres psql -U ai_nexus -d ai_nexus --set ON_ERROR_STOP=1 -c "UPDATE policy.policy_version SET content = '{\"action\":\"write\"}' WHERE policy_id = 'ci-policy' AND version = '1';"; then
            echo "Policy content mutation unexpectedly succeeded"
            exit 1
          fi
          echo "Policy content mutation was correctly rejected."
          if docker compose exec -T postgres psql -U ai_nexus -d ai_nexus --set ON_ERROR_STOP=1 -c "DELETE FROM policy.policy_version WHERE policy_id = 'ci-policy' AND version = '1';"; then
            echo "Policy version deletion unexpectedly succeeded"
            exit 1
          fi
          echo "Policy version deletion was correctly rejected."
          if docker compose exec -T postgres psql -U ai_nexus -d ai_nexus --set ON_ERROR_STOP=1 -c "TRUNCATE policy.policy_version;"; then
            echo "Policy version truncation unexpectedly succeeded"
            exit 1
          fi
          echo "Policy version truncation was correctly rejected."
      - name: Verify registry version immutability and identity constraints
        run: |
          echo "Verifying registry version immutability and identity constraints..."
          docker compose exec -T postgres psql -U ai_nexus -d ai_nexus --set ON_ERROR_STOP=1 -c "INSERT INTO registry.artifact(artifact_type, artifact_id, name, owner_ref, tenant_id, lifecycle_status) VALUES ('agent', 'ci-agent', 'CI Agent', 'ci-owner', 'ci-tenant', 'DRAFT') ON CONFLICT DO NOTHING; INSERT INTO registry.artifact_version(artifact_type, artifact_id, version, content, content_digest, lifecycle_status, created_by) VALUES ('agent', 'ci-agent', '1.0', '{\"name\":\"ci-agent\"}', repeat('a',64), 'DRAFT', 'ci-user') ON CONFLICT DO NOTHING;"
          if docker compose exec -T postgres psql -U ai_nexus -d ai_nexus --set ON_ERROR_STOP=1 -c "UPDATE registry.artifact_version SET content = '{\"name\":\"tampered\"}' WHERE artifact_type = 'agent' AND artifact_id = 'ci-agent' AND version = '1.0';"; then
            echo "Artifact version mutation unexpectedly succeeded"
            exit 1
          fi
          echo "Artifact version content mutation was correctly rejected."
          if docker compose exec -T postgres psql -U ai_nexus -d ai_nexus --set ON_ERROR_STOP=1 -c "DELETE FROM registry.artifact_version WHERE artifact_type = 'agent' AND artifact_id = 'ci-agent' AND version = '1.0';"; then
            echo "Artifact version deletion unexpectedly succeeded"
            exit 1
          fi
          echo "Artifact version deletion was correctly rejected."
          if docker compose exec -T postgres psql -U ai_nexus -d ai_nexus --set ON_ERROR_STOP=1 -c "TRUNCATE registry.artifact_version;"; then
            echo "Artifact version truncation unexpectedly succeeded"
            exit 1
          fi
          echo "Artifact version truncation was correctly rejected."
          if ! docker compose exec -T postgres psql -U ai_nexus -d ai_nexus --set ON_ERROR_STOP=1 -c "INSERT INTO registry.artifact_version(artifact_type, artifact_id, version, content, content_digest, lifecycle_status, created_by) VALUES ('agent', 'ci-agent', '1.0', '{\"name\":\"ci-agent\"}', repeat('a',64), 'DRAFT', 'ci-user') ON CONFLICT DO NOTHING; INSERT INTO registry.agent(agent_id, name, owner_ref, tenant_id, lifecycle_status, risk_classification, data_classification) VALUES ('ci-agent', 'CI Agent', 'ci-owner', 'ci-tenant', 'DRAFT', 'low', 'internal') ON CONFLICT DO NOTHING; INSERT INTO registry.agent_version(agent_id, version, artifact_id_version, artifact_version, content, content_digest, lifecycle_status, created_by) VALUES ('ci-agent', '1.0', 'ci-agent', '1.0', '{\"name\":\"ci-agent\"}', repeat('a',64), 'DRAFT', 'ci-user') ON CONFLICT DO NOTHING;"; then
            echo "Registry agent version seed failed"
            exit 1
          fi
          if docker compose exec -T postgres psql -U ai_nexus -d ai_nexus --set ON_ERROR_STOP=1 -c "UPDATE registry.agent_version SET capability_metadata = '{\"tampered\":true}' WHERE agent_id = 'ci-agent' AND version = '1.0';"; then
            echo "Agent version mutation unexpectedly succeeded"
            exit 1
          fi
          echo "Agent version content metadata mutation was correctly rejected."
          if docker compose exec -T postgres psql -U ai_nexus -d ai_nexus --set ON_ERROR_STOP=1 -c "DELETE FROM registry.agent_version WHERE agent_id = 'ci-agent' AND version = '1.0';"; then
            echo "Agent version deletion unexpectedly succeeded"
            exit 1
          fi
          echo "Agent version deletion was correctly rejected."
          if docker compose exec -T postgres psql -U ai_nexus -d ai_nexus --set ON_ERROR_STOP=1 -c "TRUNCATE registry.agent_version;"; then
            echo "Agent version truncation unexpectedly succeeded"
            exit 1
          fi
          echo "Agent version truncation was correctly rejected."
      - name: Verify immutable audit evidence
        run: |
          echo "Verifying immutable audit evidence..."
          docker compose exec -T postgres psql -U ai_nexus -d ai_nexus --set ON_ERROR_STOP=1 -c "INSERT INTO \"authorization\".event(event_id, event_type, tenant_id, action, target, reason_code) VALUES ('00000000-0000-0000-0000-000000000001', 'AUTHORIZATION_DENIED', 'ci-tenant', 'resource.read', 'protected-resource', 'CI_TEST') ON CONFLICT DO NOTHING;"
          if docker compose exec -T postgres psql -U ai_nexus -d ai_nexus --set ON_ERROR_STOP=1 -c "UPDATE \"authorization\".event SET event_type = 'TAMPERED' WHERE event_id = '00000000-0000-0000-0000-000000000001';"; then
            echo "Audit evidence mutation unexpectedly succeeded"
            exit 1
          fi
          echo "Audit evidence mutation was correctly rejected."
          if docker compose exec -T postgres psql -U ai_nexus -d ai_nexus --set ON_ERROR_STOP=1 -c "DELETE FROM \"authorization\".event WHERE event_id = '00000000-0000-0000-0000-000000000001';"; then
            echo "Audit evidence deletion unexpectedly succeeded"
            exit 1
          fi
          echo "Audit evidence deletion was correctly rejected."
          if docker compose exec -T postgres psql -U ai_nexus -d ai_nexus --set ON_ERROR_STOP=1 -c "TRUNCATE \"authorization\".event;"; then
            echo "Audit evidence truncation unexpectedly succeeded"
            exit 1
          fi
          echo "Audit evidence truncation was correctly rejected."
      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up PostgreSQL resources..."
          docker compose down -v
          echo "PostgreSQL cleanup completed."

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for obvious private key material
        run: |
          if grep -R -n --exclude-dir=.git --exclude='*.md' -E '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' .; then
            echo "Private key material detected"
            exit 1
          fi
