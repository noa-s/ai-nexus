name: CI

on:
  pull_request:
  push:
    branches: [staging, master]

jobs:
  node-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start Node API container
        run: docker compose build api-edge && docker compose up -d postgres api-edge
      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "API Edge did not become ready"
          docker compose logs api-edge
          exit 1
      - name: Cleanup
        if: always()
        run: docker compose down -v

  python-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/ai-data-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q src tests
      - run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Cleanup Docker resources if present
        if: always()
        run: docker compose down -v

  database-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL with pgvector
        run: docker compose up -d postgres
      - name: Wait for PostgreSQL readiness
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U ai_nexus -d ai_nexus; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready"
          exit 1
      - name: Apply initial migration
        run: docker compose exec -T postgres psql -U ai_nexus -d ai_nexus --set ON_ERROR_STOP=1 -f /dev/stdin < database/migrations/001_initial_platform.sql
      - name: Verify pgvector
        run: docker compose exec -T postgres psql -U ai_nexus -d ai_nexus --set ON_ERROR_STOP=1 -c "SELECT extname FROM pg_extension WHERE extname = 'vector';"
      - name: Cleanup
        if: always()
        run: docker compose down -v

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for obvious private key material
        run: |
          if grep -R -n --exclude-dir=.git --exclude='*.md' -E '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' .; then
            echo "Private key material detected"
            exit 1
          fi
