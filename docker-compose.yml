services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ai_nexus
      POSTGRES_USER: ai_nexus
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_nexus -d ai_nexus"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-edge:
    build:
      context: ./apps/api-edge
    environment:
      NODE_ENV: development
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  ai-data-worker:
    build:
      context: ./workers/ai-data-worker
    environment:
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
